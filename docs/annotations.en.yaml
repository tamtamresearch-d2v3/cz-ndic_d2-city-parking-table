# Ruční texty k tabulkám elementů – jediný ručně psaný vstup tabulek.
# Klíč = název třídy ve schématu (např. SituationRecord), pod ním element:
#
# SituationRecord:
#   _: Úvodní věta tabulky (nepovinné).
#   probabilityOfOccurrence:
#     note: Popis z pohledu NDIC.
#     card: "1..1"      # pravidlo NDIC nad rámec schématu (tmavě modře)
#     required: true    # NDIC vždy vyplňuje
#     values:           # překlad/upřesnění hodnot výčtu jen pro tento element
#       certain: jistě nastalo
#   locationReference:
#     variants: reduced # u elementu s více typy: výčet typů je zúžený profilem (popisek „zúžený výčet – N“);
#                       # seznam názvů tříd ([A, B]) uvede jen tyto typy
#
# _enum:                # překlady hodnot výčtů pro celý formát (přepisují sdílený slovník kitu)
#   ProbabilityEnum.certain: jistá
# _unused_types: [LinearLocation]   # třídy, které schéma připouští, ale formát nepoužívá (ve výčtech variant se neuvádějí)

FacilityObject:
  name:
    ndic: Name of the car park; the name of a P+R car park starts with "P+R" and the car park belongs to the table `CzechParkAndRideTable`.
CommonComponents:
  operatingPattern:
    card: 0..1
    ndic: One usage scenario (`prk:UsageScenario`); a P+R car park has `parkAndRide`.
  characteristics:
    card: 0..1
    ndic: One capacity of the car park (the car park serves one type of vehicles).
SingleRoadLinearLocation:
  linearWithinLinearElement:
    card: 1..2
    ndic: Global Network section on which the point of the car park lies; two sections if the point lies on their boundary.
  alertCLinear:
    card: 0..1
    ndic: Only for car parks whose section has an ALERT-C linear location.
Location:
  coordinatesForDisplay:
    ndic: Point of the car park; until the operator provides the exact point (e.g. the entrance), the middle of the access road.
