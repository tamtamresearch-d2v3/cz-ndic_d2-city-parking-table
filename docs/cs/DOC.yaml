perex: 'Tento dokument popisuje datový formát, používaný pro poskytování statického popisu městských parkovišť a parkovišť P+R: identifikátoru, názvu, polohy, kapacity, způsobu využití, provozovatele a provozní doby. Na tabulku parkovišť se odkazují zprávy formátu x-format:cz-ndic_d2-city-parking-status-v1.0 s aktuální obsazeností. Formát vychází z publikace prk:ParkingTablePublication modelu DATEX II 3.7 a je lehkou podmnožinou profilu pro parkoviště nákladních vozidel (ITP).'
